title: hsnr-aushang
author: Joe Slam
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    typst:
      logo: "HSNRfb10s.png"
      lang: de
      template-partials:
        - typst-template.typ
        - typst-show.typ
    pdf:
      documentclass: scrartcl
      papersize: a4paper
      fontsize: 11pt
      geometry:
        - top=30mm
        - bottom=30mm
        - left=20mm
        - right=20mm
        - headsep=10mm
      df-print: kable
      code-line-numbers: true # false
      keep-tex: false # true # false
      lang: de
      date-format: "DD.MM.YYYY"
      linkcolor: black
      nomaketitle: true
      HSNRcolors: true
      logo: HSNRfb10s.png
      execute:
        echo: false
        warning: false
      include-in-header: in-header.tex   # header
      template-partials:
        - title.tex
        - before-body.tex

