title: hsnr-article
author: Joe Slam
version: 1.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    typst:
      logo: HSNRfb10.png
      csl: apa-single-spaced.csl
      logowidth: 90mm
      logoascent: 0mm
      lang: de
      date-format: "DD.MM.YYYY"
      numbering: "1."
      number-align: center
      font: "Times New Roman"
      font-size: 11pt
      paper: a4
      footer-pre: "Seite"
      site-of: "von"
      margin:
        top: 35mm
        bottom: 30mm
        right: 20mm
        left: 20mm
      template-partials:
        - typst-template.typ
        - typst-show.typ
    pdf:
      documentclass: scrartcl
      classoption:
        - twocolumn
      papersize: a4
      fontsize: 11pt
      geometry:
        - top=20mm
        - bottom=20mm
        - left=15mm
        - right=15mm
        - headsep=10mm
      df-print: kable
      toc: false
      code-line-numbers: true # false
      keep-tex: false #true # false
      lang: de
      date-format: "DD.MM.YYYY"
      linkcolor: black
      number-sections: true
      logo: HSNRfb10.png
      csl: apa-single-spaced.csl
      language:
        crossref-ch-prefix: "Kapitel"
        crossref-sec-prefix: "Abschnitt"
      link-citations: true
      execute:
        echo: false
        warning: false
      include-in-header: in-header.tex   # header
      template-partials:
        - title.tex
        - before-body.tex
